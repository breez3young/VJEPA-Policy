name: Lightweight checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source environment
        run: python scripts/check_environment.py --profile source
      - name: Python and Bash syntax
        run: |
          python -m compileall -q src scripts examples tests
          while IFS= read -r file; do bash -n "$file"; done < <(git ls-files -- '*.sh' '*.env')
      - name: Protocol and launcher regression checks
        run: python -m unittest discover -s tests -v
