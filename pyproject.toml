[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa_policy"
version = "0.1.0"
description = "VJEPA-Policy: language-conditioned V-JEPA world model + flow-matching action expert"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "av>=12.0",
  "datasets>=3.0,<4",
  "einops>=0.7",
  "gitpython>=3.1",
  "huggingface-hub>=0.29",
  "hydra-core>=1.3",
  "jsonlines>=4.0",
  "lerobot>=0.3.3,<0.4",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "packaging>=24.0",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "sentencepiece>=0.2",
  "pillow>=10.0",
  "timm>=1.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.65",
  "transformers>=4.40",
  "wandb>=0.16",
]

[project.optional-dependencies]
serving = ["openpi-client>=0.1.0", "tyro>=0.9", "websockets>=14"]
# The simulator is kept optional because training and model inspection do not
# need a local LIBERO installation.
libero = ["robosuite==1.4.1", "mujoco==3.2.3", "bddl", "glfw", "imageio[ffmpeg]", "termcolor"]

[project.scripts]
vjepa-precompute-text = "vjepa_policy.text_embeddings:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vjepa_policy*"]
