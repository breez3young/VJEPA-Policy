# Full classified LIBERO-Plus protocol used by the paper.
# The official harness owns the benchmark implementation and simulator.
server:
  url: "ws://localhost:8000"
  timeout: 120

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero-plus:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_plus.benchmark:LIBEROPlusBenchmark"
    subname: libero_plus_spatial
    episodes_per_task: 1
    params:
      suite: libero_spatial
      canonical_task_language: true
      seed: 7
      num_steps_wait: 10
    recording:
      record_step: false
      record_video: false

  - benchmark: "vla_eval.benchmarks.libero_plus.benchmark:LIBEROPlusBenchmark"
    subname: libero_plus_object
    episodes_per_task: 1
    params:
      suite: libero_object
      canonical_task_language: true
      seed: 7
      num_steps_wait: 10
    recording:
      record_step: false
      record_video: false

  - benchmark: "vla_eval.benchmarks.libero_plus.benchmark:LIBEROPlusBenchmark"
    subname: libero_plus_goal
    episodes_per_task: 1
    params:
      suite: libero_goal
      canonical_task_language: true
      seed: 7
      num_steps_wait: 10
    recording:
      record_step: false
      record_video: false

  - benchmark: "vla_eval.benchmarks.libero_plus.benchmark:LIBEROPlusBenchmark"
    subname: libero_plus_10
    episodes_per_task: 1
    params:
      suite: libero_10
      canonical_task_language: true
      seed: 7
      num_steps_wait: 10
    recording:
      record_step: false
      record_video: false
